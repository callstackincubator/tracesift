buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.properties["TracesiftProfiler_kotlinVersion"] ?: "2.0.21"}"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

/** Fall back to the app's value when it sets one, so the library tracks its host. */
def host(String name, Object fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.tracesift.profiler"
  compileSdk host("compileSdkVersion", 35)

  defaultConfig {
    minSdk host("minSdkVersion", 24)

    // The Gradle property arms profiling without editing the host app's manifest.
    manifestPlaceholders = [
      tracesiftProfilerEnabled: (project.findProperty("tracesiftProfiler") ?: "false").toString(),
    ]
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

kotlin {
  jvmToolchain(17)
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Version-less on purpose: the React Native Gradle plugin in the host app pins this to whatever
  // React Native the app is on.
  implementation "com.facebook.react:react-android"
}
